<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application mobile d'essai</title>
<style>
  /* L'application mobile de la banque d'essai, inchangée : elle appelle son API à travers la passerelle Mayem, qui
     traduit les réponses. L'onglet Assistant parle au noyau conversationnel. ?canal=web l'étiquette « web ». */
  :root { color-scheme: light; --fond: #e9eef0; --app: #fff; --encre: #12262c; --doux: #56676d; --ligne: #dde3e6; --marque: #0f4c5c; --erreur: #9a3b12; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fond); font: 15px/1.45 system-ui, sans-serif; color: var(--encre); padding: 16px; }
  .app { width: 360px; max-width: 100%; height: 680px; max-height: calc(100vh - 32px); background: var(--app); border-radius: 26px; box-shadow: 0 20px 40px -18px #0006; display: flex; flex-direction: column; overflow: hidden; }
  header { background: var(--marque); color: #fff; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header b { font-size: 1.05rem; }
  .langues button { font: inherit; font-size: .8rem; border: 1px solid #fff8; background: transparent; color: #fff; border-radius: 12px; padding: 3px 9px; cursor: pointer; }
  .langues button[aria-pressed="true"] { background: #fff; color: var(--marque); }
  main { flex: 1; overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; }
  nav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ligne); }
  nav button { font: inherit; font-size: .8rem; padding: 12px 4px; border: 0; background: none; color: var(--doux); cursor: pointer; }
  nav button[aria-current="page"] { color: var(--marque); font-weight: 700; }
  .carte { border: 1px solid var(--ligne); border-radius: 14px; padding: 14px; display: grid; gap: 6px; }
  .titre { font-weight: 700; color: var(--marque); }
  .grand { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .doux { color: var(--doux); font-size: .85rem; }
  .erreur { color: var(--erreur); font-weight: 600; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--doux); }
  input { font: inherit; padding: 10px; border: 1px solid var(--ligne); border-radius: 10px; color: var(--encre); }
  .bouton { font: inherit; font-weight: 700; padding: 11px; border: 0; border-radius: 12px; background: var(--marque); color: #fff; cursor: pointer; }
  .bouton.second { background: transparent; color: var(--marque); border: 1px solid var(--marque); }
  :focus-visible { outline: 3px solid #7cc4d4; outline-offset: 2px; }
  .bulle { padding: 10px 12px; border-radius: 14px; max-width: 85%; white-space: pre-line; }
  .moi { background: var(--marque); color: #fff; justify-self: end; }
  .mayem { background: #eef3f4; justify-self: start; }
  form.chat { display: flex; gap: 8px; }
  form.chat input { flex: 1; min-width: 0; }
</style>
</head>
<body>
<div class="app">
  <header><b>Ma banque</b><span class="langues" id="langues"></span></header>
  <main id="vue" aria-live="polite"></main>
  <nav>
    <button type="button" data-vue="solde">Solde</button>
    <button type="button" data-vue="historique">Historique</button>
    <button type="button" data-vue="envoyer">Envoyer</button>
    <button type="button" data-vue="assistant">Assistant</button>
  </nav>
</div>
<script>
const canal = new URLSearchParams(location.search).get('canal') || 'mobile';
const etat = { langue: 'fr', vue: 'solde', session: null, chat: [] };
const $ = (id) => document.getElementById(id);
const el = (balise, attributs = {}, ...enfants) => { const e = Object.assign(document.createElement(balise), attributs); e.append(...enfants); return e; };
const api = async (chemin, corps) => {
  const reponse = await fetch(`/v1/relais/api/${chemin}`, {
    method: corps ? 'POST' : 'GET', headers: { 'content-type': 'application/json', 'x-mayem-langue': etat.langue, 'x-mayem-canal': canal },
    body: corps ? JSON.stringify(corps) : undefined,
  });
  return { ok: reponse.ok, corps: await reponse.json() };
};
const carte = (...enfants) => el('div', { className: 'carte' }, ...enfants);
const fcfa = (n) => `${String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ')} FCFA`;

const VUES = {
  async solde() {
    const { corps } = await api('solde');
    return [carte(el('div', { className: 'titre', textContent: corps.titre }), el('div', { className: 'grand', textContent: fcfa(corps.solde) }), el('div', { className: 'doux', textContent: corps.message }))];
  },
  async historique() {
    const { corps } = await api('historique');
    return [el('div', { className: 'titre', textContent: corps.titre }), ...corps.operations.map((o) => carte(el('b', { textContent: o.libelle }), el('div', { textContent: `${fcfa(o.montant)} · ${o.nom}` }), el('div', { className: 'doux', textContent: o.date })))];
  },
  async envoyer() {
    const telephone = el('input', { id: 'telephone', inputMode: 'numeric', value: '678901234' });
    const montant = el('input', { id: 'montant', inputMode: 'numeric', value: '5000' });
    const zone = el('div', { className: 'carte' });
    const formulaire = el('form', { className: 'carte' }, el('label', {}, 'Numéro', telephone), el('label', {}, 'Montant', montant), el('button', { className: 'bouton', textContent: 'Continuer' }));
    formulaire.onsubmit = async (e) => {
      e.preventDefault();
      const demande = { telephone: telephone.value.trim(), montant: montant.value.trim() };
      const { ok, corps } = await api('transfert', demande);
      if (!ok) { zone.replaceChildren(el('div', { className: 'erreur', textContent: corps.erreur })); return; }
      const pin = el('input', { id: 'pin', type: 'password', inputMode: 'numeric', autocomplete: 'off', placeholder: 'PIN' });
      const confirmer = el('button', { className: 'bouton', type: 'button', textContent: corps.actions[0] });
      const annuler = el('button', { className: 'bouton second', type: 'button', textContent: corps.actions[1] });
      zone.replaceChildren(el('div', { className: 'titre', textContent: corps.titre }), el('div', { textContent: corps.message }), el('div', { textContent: corps.frais }),
        el('b', { textContent: corps.total }), el('div', { className: 'doux', textContent: corps.avertissement }), pin, confirmer, annuler);
      annuler.onclick = () => zone.replaceChildren();
      confirmer.onclick = async () => {
        const fin = await api('transfert/confirmer', { ...demande, pin: pin.value });
        zone.replaceChildren(fin.ok
          ? el('div', {}, el('div', { className: 'titre', textContent: fin.corps.titre }), el('div', { textContent: fin.corps.message }), el('div', { className: 'doux', textContent: fin.corps.detail }))
          : el('div', { className: 'erreur', textContent: fin.corps.erreur }));
      };
    };
    return [formulaire, zone];
  },
  async assistant() {
    const champ = el('input', { id: 'question', placeholder: 'Écrivez votre demande', autocomplete: 'off' });
    const formulaire = el('form', { className: 'chat' }, champ, el('button', { className: 'bouton', textContent: '›', ariaLabel: 'Envoyer' }));
    formulaire.onsubmit = async (e) => {
      e.preventDefault();
      const texte = champ.value.trim();
      if (!texte) return;
      etat.chat.push({ moi: true, texte });
      const reponse = await (await fetch('/v1/converser', { method: 'POST', body: JSON.stringify({ texte, canal, session: etat.session, langue: etat.langue }) })).json();
      etat.session = reponse.session;
      etat.chat.push({ moi: false, texte: reponse.reponse });
      montrer();
    };
    setTimeout(() => champ.focus());
    return [...etat.chat.map((m) => el('div', { className: `bulle ${m.moi ? 'moi' : 'mayem'}`, textContent: m.texte })), formulaire];
  },
};

async function montrer() {
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-current', b.dataset.vue === etat.vue ? 'page' : 'false'));
  try { $('vue').replaceChildren(...await VUES[etat.vue]()); }
  catch { $('vue').replaceChildren(el('div', { className: 'erreur', textContent: 'Service indisponible.' })); }
}

async function demarrer() {
  const sante = await (await fetch('/sante')).json();
  for (const [code, nom] of [['fr', 'Français'], [sante.langue, sante.nom]]) {
    const b = el('button', { type: 'button', textContent: nom });
    b.onclick = () => { etat.langue = code; etat.session = null; document.querySelectorAll('.langues button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); montrer(); };
    b.setAttribute('aria-pressed', String(code === etat.langue));
    $('langues').append(b);
  }
  document.querySelectorAll('nav button').forEach((b) => { b.onclick = () => { etat.vue = b.dataset.vue; montrer(); }; });
  montrer();
}
demarrer();
</script>
</body>
</html>
